<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>Passwörter – Aura</title>
<link rel="stylesheet" href="/aura.css">
<style>
.toolbar{display:flex;gap:12px;margin:0 0 20px}
.pw{font-family:Consolas,"Cascadia Mono",monospace;font-size:13px;letter-spacing:1px;
  color:rgb(var(--fg-dim));min-width:120px;text-align:right}
.pw.on{color:rgb(var(--fg));letter-spacing:0}
.acts{display:flex;gap:6px;flex:none}
.acts button{height:30px;padding:0 10px;font-size:13px}
/* Hinweisfeld im shadcn-Alert-Zuschnitt: neutrale Karte, Symbol trägt die Farbe. */
.warn{display:flex;gap:12px;padding:14px 16px;border-radius:var(--r-lg);margin-bottom:20px;
  background:rgb(var(--card));border:1px solid rgb(var(--line));font-size:13px;line-height:1.6;
  color:rgb(var(--fg-dim))}
.warn svg{width:18px;height:18px;flex:none;stroke:rgb(var(--fg));fill:none;stroke-width:1.8;margin-top:2px}
</style>
</head>
<body>
<div class="page">
  <div class="head"><h1>Passwörter</h1><span class="spacer"></span><span class="badge" id="count">0</span></div>
  <p class="lead">Lokal gespeichert und mit Windows-DPAPI an dein Benutzerkonto gebunden.</p>
  <div class="warn">
    <svg viewBox="0 0 24 24"><path d="M12 3l7 3v5c0 4.4-3 8.3-7 10-4-1.7-7-5.6-7-10V6z"/><path d="M12 9v4m0 3h.01"/></svg>
    <div>Entschlüsseln klappt nur in deinem Windows-Konto auf diesem Gerät. Kopierte Passwörter
    liegen danach in der Zwischenablage — Aura leert sie nicht automatisch.</div>
  </div>
  <div class="toolbar">
    <label class="search-field">
      <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
      <input id="q" type="search" placeholder="Nach Seite oder Benutzer suchen …" autocomplete="off">
    </label>
    <button id="import">Aus Chrome importieren</button>
  </div>
  <div id="list" class="fade"></div>
</div>
<script>
const $ = s => document.querySelector(s);
const post = m => window.chrome?.webview?.postMessage(m);
let ITEMS = [];
const REVEALED = new Map();

$('#q').addEventListener('input', render);
$('#import').addEventListener('click', () => post({cmd: 'open', url: 'aura://import'}));

function render() {
  const q = $('#q').value.trim().toLowerCase();
  const list = $('#list');
  list.innerHTML = '';
  const shown = ITEMS.filter(e => !q || e.origin.toLowerCase().includes(q) || (e.user || '').toLowerCase().includes(q));
  $('#count').textContent = ITEMS.length;
  if (!shown.length) {
    list.innerHTML = `<div class="empty">${ITEMS.length ? 'Nichts gefunden.' : 'Noch keine Passwörter gespeichert.'}</div>`;
    return;
  }
  for (const e of shown) {
    const d = document.createElement('div');
    d.className = 'item';
    const shown_pw = REVEALED.get(e.id);
    d.innerHTML = `<div class="ph">${(e.origin[0] || '?').toUpperCase()}</div>
      <div class="t"><b></b><small></small></div>
      <span class="pw${shown_pw ? ' on' : ''}"></span>
      <div class="acts">
        <button data-a="show">${shown_pw ? 'Verbergen' : 'Anzeigen'}</button>
        <button data-a="copy">Kopieren</button>
        <button class="danger" data-a="del">Löschen</button>
      </div>`;
    d.querySelector('b').textContent = e.origin;
    d.querySelector('small').textContent = e.user || '(kein Benutzername)';
    d.querySelector('.pw').textContent = shown_pw || '••••••••••';
    d.querySelector('[data-a=show]').addEventListener('click', () => {
      if (REVEALED.has(e.id)) { REVEALED.delete(e.id); render(); }
      else post({cmd: 'password_reveal', id: e.id});
    });
    d.querySelector('[data-a=copy]').addEventListener('click', () => {
      const v = REVEALED.get(e.id);
      if (v) navigator.clipboard?.writeText(v);
      else post({cmd: 'password_reveal', id: e.id, copy: true});
    });
    d.querySelector('[data-a=del]').addEventListener('click', () => {
      if (confirm(`Passwort für ${e.origin} löschen?`)) post({cmd: 'password_remove', id: e.id});
    });
    list.appendChild(d);
  }
}

window.chrome?.webview?.addEventListener('message', ev => {
  const m = ev.data;
  if (m.type === 'init') {
    document.body.classList.toggle('dark', !!m.theme.dark);
    document.body.classList.toggle('reduce', !!m.theme.reduce);
    document.documentElement.style.setProperty('--accent', m.theme.accent);
    document.documentElement.style.setProperty('--accent-fg', (a => {const [r,g,b]=String(a).split(',').map(Number); return (r*.299+g*.587+b*.114) > 150 ? '9,9,11' : '255,255,255';})(m.theme.accent));
    ITEMS = (m.data || {}).items || [];
    render();
  }
  if (m.type === 'password') {
    REVEALED.set(m.id, m.value);
    render();
  }
});
</script>
</body>
</html>
