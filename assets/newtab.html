<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>Aura Browser</title>
<link rel="stylesheet" href="/aura.css">
<script src="/aura.js" defer></script>
<style>
html,body{height:100%}
body{
  overflow-x:hidden; overflow-y:auto;
  display:flex; flex-direction:column; align-items:center;
  padding:0 24px 96px;
}
.wrap{position:relative;width:min(880px,100%);display:flex;flex-direction:column;align-items:stretch}
/* ---------- Kopf ----------
   Kein Farbverlauf im Text, kein Leuchten hinter der Seite. Die Begruessung
   ist eine Ueberschrift, keine Leuchtreklame. */
.hero{padding:14vh 0 0;text-align:center;animation:rise .2s var(--ease) both}
h1{font-size:30px;font-weight:600;letter-spacing:-.6px;line-height:1.2;color:rgb(var(--fg))}
.sub{margin-top:6px;font-size:14px;color:rgb(var(--fg-dim))}
/* ---------- Suche ---------- */
.search{
  margin:28px auto 0;width:min(560px,100%);
  display:flex;align-items:center;gap:10px;
  height:44px;padding:0 14px;border-radius:var(--r-lg);cursor:text;
  background:rgb(var(--card));
  border:1px solid rgb(var(--line));
  transition:border-color .15s var(--ease),box-shadow .15s var(--ease);
}
.search .ico{width:16px;height:16px;flex:none;stroke:rgb(var(--fg-dim));fill:none;stroke-width:2}
.search input{flex:1;min-width:0;border:none;background:none;padding:0;height:auto;color:inherit;font:inherit;font-size:14px}
.search input:focus{outline:none;box-shadow:none}
.search input::placeholder{color:rgb(var(--fg-dim))}
.search:focus-within{border-color:rgb(var(--accent));box-shadow:0 0 0 3px rgba(var(--accent),.15)}
.search .keys{margin-left:auto;display:flex;gap:5px;flex:none;opacity:0;transition:opacity .15s var(--ease)}
.search:focus-within .keys{opacity:1}
/* ---------- Chips ---------- */
.chips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:14px}
.chip{
  display:inline-flex;align-items:center;gap:7px;
  height:32px;padding:0 12px;border-radius:var(--r-md);font-size:13px;font-weight:500;cursor:pointer;
  background:rgb(var(--card));
  border:1px solid rgb(var(--line));
  color:rgb(var(--fg-dim));
  transition:background .15s var(--ease),color .15s var(--ease);
}
.chip:hover{background:rgb(var(--muted));color:rgb(var(--fg))}
.chip svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:2}
/* ---------- Abschnitte ---------- */
section{width:100%;margin-top:40px;animation:rise .2s var(--ease) both}
section:nth-of-type(2){animation-delay:.04s}
section:nth-of-type(3){animation-delay:.08s}
.shead{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.shead h2{font-size:14px;font-weight:600;letter-spacing:-.1px;color:rgb(var(--fg));margin:0;text-transform:none}
.shead .line{flex:1}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:8px}
.tile{
  display:flex;align-items:center;gap:10px;
  padding:11px 12px;border-radius:var(--r-lg);cursor:pointer;
  background:rgb(var(--card));
  border:1px solid rgb(var(--line));
  transition:background .15s var(--ease);
}
.tile:hover{background:rgb(var(--muted))}
.tile img{width:20px;height:20px;border-radius:4px;flex:none}
.tile .ph{
  width:20px;height:20px;border-radius:4px;flex:none;display:grid;place-items:center;
  font-size:10px;font-weight:600;color:rgb(var(--fg-dim));background:rgb(var(--muted));
}
.tile .txt{min-width:0}
.tile b{display:block;font-size:13px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tile small{display:block;font-size:12px;color:rgb(var(--fg-dim));white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* ---------- Shield-Karten ---------- */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:8px}
.stat{
  padding:16px;border-radius:var(--r-lg);
  background:rgb(var(--card));
  border:1px solid rgb(var(--line));
}
.stat .k{display:flex;align-items:center;gap:7px;font-size:13px;font-weight:500;color:rgb(var(--fg-dim));text-transform:none;letter-spacing:0}
.stat .k svg{width:14px;height:14px;stroke:rgb(var(--fg-dim));fill:none;stroke-width:2}
.stat .v{margin-top:6px;font-size:24px;font-weight:600;letter-spacing:-.5px;font-variant-numeric:tabular-nums}
.stat .v em{font-style:normal;font-size:13px;font-weight:400;color:rgb(var(--fg-dim));margin-left:6px}
.empty{font-size:13px;color:rgb(var(--fg-dim));padding:16px 2px}
/* ---------- Fusszeile ---------- */
.hint{margin-top:48px;width:100%;text-align:center;font-size:12px;color:rgb(var(--fg-dim));pointer-events:none}
body.reduce *{animation:none!important;transition:none!important}
</style>
</head>
<body>
<div class="wrap">
  <div class="hero">
    <h1 id="greet">Aura</h1>
    <p class="sub" id="sub">Clean. Schnell. Für Windows.</p>
    <form class="search" id="search" autocomplete="off">
      <svg class="ico" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
      <input id="q" type="text" placeholder="Suchen oder Adresse eingeben …"
             autocomplete="off" spellcheck="false" enterkeyhint="go">
      <span class="keys"><kbd>Enter</kbd></span>
    </form>
    <div class="chips" id="chips"></div>
  </div>

  <section id="sec-shield">
    <div class="shead"><h2>Aura Shield</h2><span class="line"></span><span id="shield-badge" class="badge ok">aktiv</span></div>
    <div class="stats" id="stats"></div>
  </section>

  <section id="sec-top" hidden>
    <div class="shead"><h2>Häufig besucht</h2><span class="line"></span></div>
    <div class="grid" id="topsites"></div>
  </section>

  <section id="sec-bm" hidden>
    <div class="shead"><h2>Lesezeichen</h2><span class="line"></span></div>
    <div class="grid" id="bookmarks"></div>
  </section>

  <div class="hint"><kbd>Strg</kbd>+<kbd>T</kbd> Neuer Tab &nbsp;·&nbsp; <kbd>Strg</kbd>+<kbd>K</kbd> Befehle &nbsp;·&nbsp; <kbd>F11</kbd> Vollbild</div>
</div>
<script>
const $ = s => document.querySelector(s);
const post = m => window.chrome?.webview?.postMessage(m);
const num = n => (n ?? 0).toLocaleString('de-DE');
const host = u => (u || '').replace(/^https?:\/\//, '').replace(/^www\./, '').split('/')[0];

// Suche läuft direkt hier – die Adressleiste oben bleibt zu.
$('#search').addEventListener('submit', e => {
  e.preventDefault();
  const q = $('#q').value.trim();
  if (q) post({cmd: 'search', q});
});
addEventListener('DOMContentLoaded', () => $('#q').focus());

const CHIPS = [
  ['Verlauf', 'aura://history', '<path d="M12 7v5l3 2"/><circle cx="12" cy="12" r="9"/>'],
  ['Lesezeichen', 'aura://bookmarks', '<path d="M6 4h12v16l-6-4-6 4z"/>'],
  ['Downloads', 'aura://downloads', '<path d="M12 4v10m0 0l-4-4m4 4l4-4M5 19h14"/>'],
  ['Einstellungen', 'aura://settings', '<circle cx="12" cy="12" r="3"/><path d="M12 3v3m0 12v3M3 12h3m12 0h3M5.6 5.6l2.1 2.1m8.6 8.6l2.1 2.1m0-12.8l-2.1 2.1M7.7 16.3l-2.1 2.1"/>'],
];
const chips = $('#chips');
for (const [label, url, path] of CHIPS) {
  const b = document.createElement('button');
  b.className = 'chip';
  b.innerHTML = `<svg viewBox="0 0 24 24">${path}</svg>${label}`;
  b.addEventListener('click', () => post({cmd: 'open', url}));
  chips.appendChild(b);
}

function tile(e) {
  const d = document.createElement('div');
  d.className = 'tile';
  const h = host(e.url);
  const icon = e.favicon
    ? `<img src="${e.favicon}" alt="">`
    : `<div class="ph">${(h[0] || 'A').toUpperCase()}</div>`;
  d.innerHTML = `${icon}<div class="txt"><b></b><small></small></div>`;
  d.querySelector('b').textContent = e.title || h;
  d.querySelector('small').textContent = h;
  d.title = e.url;
  d.addEventListener('click', ev => post({cmd: ev.ctrlKey ? 'open_new' : 'open', url: e.url}));
  return d;
}

function stat(icon, key, value, unit) {
  return `<div class="stat"><div class="k"><svg viewBox="0 0 24 24">${icon}</svg>${key}</div>
          <div class="v">${value}${unit ? `<em>${unit}</em>` : ''}</div></div>`;
}

const I_SHIELD = '<path d="M12 3l7 3v5c0 4.4-3 8.3-7 10-4-1.7-7-5.6-7-10V6z"/>';
const I_LIST = '<path d="M8 6h12M8 12h12M8 18h12M4 6h.01M4 12h.01M4 18h.01"/>';
const I_EYE = '<path d="M2 12s3.6-6 10-6 10 6 10 6-3.6 6-10 6-10-6-10-6z"/><circle cx="12" cy="12" r="2.5"/>';

window.chrome?.webview?.addEventListener('message', ev => {
  const m = ev.data;
  if (m.type !== 'init') return;
  const t = m.theme, d = m.data || {};
  document.body.classList.toggle('dark', !!t.dark);
  document.body.classList.toggle('reduce', !!t.reduce);
  document.documentElement.style.setProperty('--accent', t.accent);
  document.documentElement.style.setProperty('--accent-fg', (a => {const [r,g,b]=String(a).split(',').map(Number); return (r*.299+g*.587+b*.114) > 150 ? '9,9,11' : '255,255,255';})(t.accent));

  const h = new Date().getHours();
  $('#greet').textContent = h < 5 ? 'Gute Nacht' : h < 11 ? 'Guten Morgen' : h < 18 ? 'Guten Tag' : 'Guten Abend';
  if (t.private) $('#sub').textContent = 'Privates Fenster – nichts wird gespeichert.';

  const s = d.shield || {};
  $('#shield-badge').textContent = s.on ? 'aktiv' : 'aus';
  $('#shield-badge').className = 'badge' + (s.on ? ' ok' : ' off');
  $('#stats').innerHTML =
    stat(I_SHIELD, 'Blockiert insgesamt', num(s.blocked)) +
    stat(I_LIST, 'Filterregeln', num(s.rules)) +
    stat(I_EYE, 'Kosmetikregeln', num(s.cosmetic));

  const tops = d.topsites || [], bms = d.bookmarks || [];
  if (tops.length) {
    $('#sec-top').hidden = false;
    const g = $('#topsites'); g.innerHTML = '';
    tops.forEach(e => g.appendChild(tile(e)));
  }
  if (bms.length) {
    $('#sec-bm').hidden = false;
    const g = $('#bookmarks'); g.innerHTML = '';
    bms.forEach(e => g.appendChild(tile(e)));
  }
});
</script>
</body>
</html>
