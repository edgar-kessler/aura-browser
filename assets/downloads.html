<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>Downloads – Aura</title>
<link rel="stylesheet" href="/aura.css">
<script src="/aura.js" defer></script>
<style>
.dl{display:flex;align-items:center;gap:14px;padding:14px 16px;border-radius:var(--r-lg);
  background:rgb(var(--card));border:1px solid rgb(var(--line));margin-bottom:8px;
  transition:background .15s var(--ease)}
.dl:hover{background:rgb(var(--muted))}
.dl .ic{width:36px;height:36px;border-radius:var(--r-md);background:rgb(var(--muted));display:grid;place-items:center;flex:none}
.dl .ic svg{width:18px;height:18px;stroke:rgb(var(--fg-dim));fill:none;stroke-width:2}
.dl .t{flex:1;min-width:0}
.dl .t b{display:block;font-size:14px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dl .t small{display:block;color:rgb(var(--fg-dim));font-size:13px;margin-top:2px}
.dl .t .bar{margin-top:8px}
.dl .acts{display:flex;gap:8px;flex:none}
.dl .acts button{height:32px;padding:0 12px;font-size:13px}
</style>
</head>
<body>
<div class="page">
  <div class="head"><h1>Downloads</h1><span class="spacer"></span><span class="badge" id="count">0</span></div>
  <p class="lead">Dateien landen in <b>Downloads\Aura</b>.</p>
  <div id="list" class="fade"></div>
</div>
<script>
const $ = s => document.querySelector(s);
const post = m => window.chrome?.webview?.postMessage(m);
const I_DOWN = '<path d="M12 4v10m0 0l-4-4m4 4l4-4M5 19h14"/>';
const I_CHECK = '<path d="M4 12l5 5L20 6"/>';

function fmtSize(n) {
  if (!n || n < 0) return '';
  if (n < 1024) return `${n} B`;
  if (n < 1048576) return `${(n / 1024).toFixed(1)} KB`;
  if (n < 1073741824) return `${(n / 1048576).toFixed(1)} MB`;
  return `${(n / 1073741824).toFixed(2)} GB`;
}

window.chrome?.webview?.addEventListener('message', ev => {
  const m = ev.data;
  if (m.type !== 'init') return;
  document.body.classList.toggle('dark', !!m.theme.dark);
  document.body.classList.toggle('reduce', !!m.theme.reduce);
  document.documentElement.style.setProperty('--accent', m.theme.accent);
  document.documentElement.style.setProperty('--accent-fg', (a => {const [r,g,b]=String(a).split(',').map(Number); return (r*.299+g*.587+b*.114) > 150 ? '9,9,11' : '255,255,255';})(m.theme.accent));

  const list = $('#list');
  list.innerHTML = '';
  const items = m.data.items || [];
  $('#count').textContent = items.length;
  if (!items.length) {
    list.innerHTML = '<div class="empty">Noch keine Downloads.</div>';
    return;
  }
  for (const e of items) {
    const pct = e.total > 0 ? Math.min(100, Math.round(e.received / e.total * 100)) : (e.finished ? 100 : 0);
    const date = new Date(e.started * 1000).toLocaleString('de-DE');
    const d = document.createElement('div');
    d.className = 'dl';
    d.innerHTML = `<div class="ic"><svg viewBox="0 0 24 24">${e.finished ? I_CHECK : I_DOWN}</svg></div>
      <div class="t"><b></b><small></small>${e.finished ? '' : `<div class="bar"><i style="width:${pct}%"></i></div>`}</div>
      <div class="acts"><button data-a="open">Öffnen</button><button data-a="folder">Ordner</button></div>`;
    d.querySelector('b').textContent = e.filename;
    d.querySelector('small').textContent = e.finished
      ? `${fmtSize(e.total)} · ${date}`
      : `Lädt … ${pct}% · ${fmtSize(e.received)} von ${fmtSize(e.total)}`;
    d.title = e.url || e.path;
    d.querySelector('[data-a=open]').addEventListener('click', () => post({cmd: 'open_download', path: e.path}));
    d.querySelector('[data-a=folder]').addEventListener('click', () => post({cmd: 'show_in_folder', path: e.path}));
    list.appendChild(d);
  }
});
</script>
</body>
</html>
