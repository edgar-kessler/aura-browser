<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>Task-Manager – Aura</title>
<link rel="stylesheet" href="/aura.css">
<script src="/aura.js" defer></script>
<style>
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin-bottom:24px}
.stat{padding:16px;border-radius:var(--r-lg);background:rgb(var(--card));border:1px solid rgb(var(--line))}
.stat .k{font-size:13px;font-weight:500;color:rgb(var(--fg-dim))}
.stat .v{margin-top:6px;font-size:24px;font-weight:600;font-variant-numeric:tabular-nums}
/* shadcn-Tabelle: leichte Kopfzeile, Zeilentrenner, Hover als Fläche.
   table-layout:fixed hält die Spalten in der Karte – sonst drückt ein langer
   Tab-Titel die Aktionsspalte über den Rand hinaus. */
.card{overflow:hidden}
table{width:100%;table-layout:fixed;border-collapse:collapse;font-size:14px}
col.status{width:124px}
col.num{width:88px}
col.acts{width:172px}
col.pid{width:88px}
col.mem{width:136px}
th{text-align:left;font-size:13px;color:rgb(var(--fg-dim));
  font-weight:500;padding:10px;border-bottom:1px solid rgb(var(--line))}
td{padding:10px;border-bottom:1px solid rgb(var(--line));vertical-align:middle}
tr:last-child td{border-bottom:none}
tbody tr{transition:background .15s var(--ease)}
tbody tr:hover{background:rgb(var(--muted))}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
.pill-row{display:flex;align-items:center;gap:9px;min-width:0}
.pill-row img,.pill-row .ph{width:16px;height:16px;border-radius:3px;flex:none}
.pill-row .ph{display:grid;place-items:center;font-size:9px;font-weight:600;
  color:rgb(var(--fg-dim));background:rgb(var(--muted))}
.pill-row span{min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
td{overflow:hidden}
.tag{display:inline-block;padding:2px 8px;border-radius:var(--r-full);font-size:12px;font-weight:500;
  white-space:nowrap;background:rgb(var(--muted));color:rgb(var(--fg-dim));border:1px solid rgb(var(--line))}
.tag.on{background:rgba(var(--success),.12);color:rgb(var(--success));border-color:rgba(var(--success),.25)}
.tag.sleep{background:transparent}
.acts{display:flex;gap:6px;justify-content:flex-end}
.rowbtn{height:28px;padding:0 10px;font-size:13px;white-space:nowrap}
</style>
</head>
<body>
<div class="page">
  <div class="head"><h1>Task-Manager</h1><span class="spacer"></span>
    <button id="refresh">Aktualisieren</button></div>
  <p class="lead">Was Aura gerade an Arbeitsspeicher belegt — pro Tab und pro Engine-Prozess.</p>

  <div class="stats" id="stats"></div>

  <h2>Tabs</h2>
  <div class="card"><table id="tabs">
    <colgroup><col><col class="status"><col class="num"><col class="acts"></colgroup>
    <thead><tr>
      <th>Tab</th><th>Status</th><th class="num">Blockiert</th><th></th>
    </tr></thead><tbody></tbody></table></div>

  <h2>Prozesse</h2>
  <div class="card"><table id="procs">
    <colgroup><col><col class="pid"><col class="mem"></colgroup>
    <thead><tr>
      <th>Prozess</th><th class="num">PID</th><th class="num">Arbeitsspeicher</th>
    </tr></thead><tbody></tbody></table></div>
</div>
<script>
const $ = s => document.querySelector(s);
const post = m => window.chrome?.webview?.postMessage(m);
const host = u => (u || '').replace(/^https?:\/\//, '').replace(/^www\./, '').split('/')[0];
const num = n => (n ?? 0).toLocaleString('de-DE');
const mb = v => `${(v ?? 0).toLocaleString('de-DE', {minimumFractionDigits: 1, maximumFractionDigits: 1})} MB`;

$('#refresh').addEventListener('click', () => post({cmd: 'tasks_refresh'}));
let timer = setInterval(() => post({cmd: 'tasks_refresh'}), 3000);
addEventListener('pagehide', () => clearInterval(timer));

function stat(k, v) {
  return `<div class="stat"><div class="k">${k}</div><div class="v">${v}</div></div>`;
}

window.chrome?.webview?.addEventListener('message', ev => {
  const m = ev.data;
  if (m.type !== 'init') return;
  document.body.classList.toggle('dark', !!m.theme.dark);
  document.body.classList.toggle('reduce', !!m.theme.reduce);
  document.documentElement.style.setProperty('--accent', m.theme.accent);
  document.documentElement.style.setProperty('--accent-fg', (a => {const [r,g,b]=String(a).split(',').map(Number); return (r*.299+g*.587+b*.114) > 150 ? '9,9,11' : '255,255,255';})(m.theme.accent));
  const d = m.data || {}, tabs = d.tabs || [], procs = d.procs || [];

  const loaded = tabs.filter(t => t.loaded && !t.asleep).length;
  const blocked = tabs.reduce((a, t) => a + (t.blocked || 0), 0);
  $('#stats').innerHTML =
    stat('Speicher gesamt', mb(d.total_mb)) +
    stat('Tabs', `${num(tabs.length)}`) +
    stat('davon geladen', `${num(loaded)}`) +
    stat('Prozesse', `${num(procs.length)}`) +
    stat('Blockiert (Sitzung)', num(blocked));

  const tb = $('#tabs tbody');
  tb.innerHTML = '';
  tabs.forEach(t => {
    const h = host(t.url) || 'aura';
    const tr = document.createElement('tr');
    const state = t.active ? '<span class="tag on">aktiv</span>'
      : t.asleep ? '<span class="tag sleep">schläft</span>'
      : t.loaded ? '<span class="tag">geladen</span>'
      : '<span class="tag">nicht geladen</span>';
    tr.innerHTML = `<td><div class="pill-row">`
      + (t.favicon ? `<img src="${t.favicon}" alt="">` : `<div class="ph">${(h[0] || 'A').toUpperCase()}</div>`)
      + `<span></span></div></td>`
      + `<td>${state}${t.audio ? ' <span class="tag on">Ton</span>' : ''}${t.pinned ? ' <span class="tag">fix</span>' : ''}</td>`
      + `<td class="num">${num(t.blocked)}</td>`
      + `<td><div class="acts"><button class="rowbtn" data-a="go">Anzeigen</button>`
      + `<button class="rowbtn danger" data-a="close">Beenden</button></div></td>`;
    tr.querySelector('span').textContent = t.title || h;
    tr.title = t.url;
    tr.querySelector('[data-a=go]').addEventListener('click', () => post({cmd: 'tab_activate', index: t.index}));
    tr.querySelector('[data-a=close]').addEventListener('click', () => post({cmd: 'tab_close', index: t.index}));
    tb.appendChild(tr);
  });

  const pb = $('#procs tbody');
  pb.innerHTML = '';
  [...procs].sort((a, b) => (b.mb || 0) - (a.mb || 0)).forEach(p => {
    const tr = document.createElement('tr');
    tr.innerHTML = `<td>${p.kind}</td><td class="num">${p.pid}</td><td class="num">${mb(p.mb)}</td>`;
    pb.appendChild(tr);
  });
});
</script>
</body>
</html>
