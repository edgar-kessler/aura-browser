name: Release

# Baut auf jedes v*-Tag ein Windows-Paket und haengt es an das Release.
# Genau dieses ZIP holt sich der Auto-Updater aus src/update.rs.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Rust einrichten
        uses: dtolnay/rust-toolchain@stable

      - name: Cache
        uses: Swatinem/rust-cache@v2

      - name: Tests
        run: cargo test --release

      - name: Bauen
        run: cargo build --release

      - name: Paket schnueren
        shell: pwsh
        run: |
          $stage = "aura-browser-windows-x64"
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          Copy-Item target/release/aura-browser.exe $stage/
          Copy-Item target/release/WebView2Loader.dll $stage/
          Copy-Item -Recurse assets $stage/assets
          Copy-Item README.md, LICENSE $stage/
          Compress-Archive -Path "$stage/*" -DestinationPath "$stage.zip" -Force
          Get-Item "$stage.zip" | Select-Object Name, @{n='MB';e={[math]::Round($_.Length/1MB,2)}}

      - name: Installer bauen
        shell: pwsh
        run: |
          $version = if ($env:GITHUB_REF -match 'refs/tags/v(.+)') { $Matches[1] } else { "0.0.0" }
          # Nutzlast fuer den Installer aus dem bereits gebauten Paket.
          New-Item -ItemType Directory -Force -Path dist/payload | Out-Null
          Copy-Item aura-browser-windows-x64/* dist/payload -Recurse -Force
          $iscc = Get-ChildItem -Path "C:\Program Files (x86)\Inno Setup 6","C:\Program Files\Inno Setup 6" `
            -Filter ISCC.exe -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $iscc) {
            choco install innosetup -y --no-progress
            $iscc = Get-ChildItem -Path "C:\Program Files (x86)\Inno Setup 6" -Filter ISCC.exe | Select-Object -First 1
          }
          & $iscc.FullName /Qp "/DAppVersion=$version" installer/aura.iss
          if ($LASTEXITCODE -ne 0) { throw "Installer-Build fehlgeschlagen" }
          Get-ChildItem dist/*.exe | Select-Object Name, @{n='MB';e={[math]::Round($_.Length/1MB,2)}}

      - name: Release veroeffentlichen
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            aura-browser-windows-x64.zip
            dist/AuraBrowserSetup-*.exe
          generate_release_notes: true

      - name: Artefakte sichern
        if: "!startsWith(github.ref, 'refs/tags/')"
        uses: actions/upload-artifact@v4
        with:
          name: aura-browser-windows-x64
          path: |
            aura-browser-windows-x64.zip
            dist/AuraBrowserSetup-*.exe
